<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>欠点ビューア[矩形版]</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6b7280;--card:#f3f4f6;--bd:#d1d5db;--ac:#0b6bcb;--af:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#ececec;--mut:#9ca3af;--card:#25272b;--bd:#3b3f45;--ac:#4c9aff;--af:#0a0a0a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#ececec;--mut:#9ca3af;--card:#25272b;--bd:#3b3f45;--ac:#4c9aff;--af:#0a0a0a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--bd)}
header b{font-size:16px}header small{color:var(--mut);font-size:11px}
select,button,label.b{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer}
button.pri{background:var(--ac);color:var(--af);border-color:var(--ac)}
#info{color:var(--mut);margin-left:auto}
main{flex:1;min-height:0;display:grid;grid-template-columns:210px minmax(0,1.3fr) minmax(0,1fr);gap:12px;padding:12px}
.col{min-height:0;overflow:auto}
.col h3{margin:0 0 6px;font-size:13px;color:var(--mut)}
#gl button{display:block;width:100%;text-align:left;margin-bottom:5px;padding:8px 10px}
#gl button.on{background:var(--ac);color:var(--af);border-color:var(--ac)}
#gl small{display:block;opacity:.8}
canvas{width:100%;height:auto;background:#fff;border:1px solid var(--bd);border-radius:8px;display:block;margin-bottom:10px}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--bd);padding:5px 7px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--bg)}
#dl tr{cursor:pointer}#dl tr.on{background:var(--ac);color:var(--af)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.55);vertical-align:-2px;margin-right:4px}
#lg{margin:-4px 0 10px;font-size:12px}
#rd{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9}#rd[hidden]{display:none}.rc{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:14px 18px;width:min(720px,94vw);max-height:92vh;overflow:auto}.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:10px 0}.rg label{display:flex;flex-direction:column;font-size:12px;color:var(--mut)}.rg input,.rg select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}.rc h3{margin:0}.rc p{margin:6px 0;color:var(--mut)}.rr{display:flex;gap:8px;justify-content:flex-end}
#dt{background:var(--card);border-radius:8px;padding:10px 12px}
#empty{margin:40px;color:var(--mut)}
#pa{display:none}
@media print{
  body{display:block;height:auto;background:#fff;color:#000}
  body>*:not(#pa){display:none!important}
  #pa{display:block}
  .pg{break-after:page}.pg:last-child{break-after:auto}
  #pa h2{font-size:15px;margin:0 0 6px}
  #pa img{width:100%;display:block}
  #pa table{font-size:11px;margin:6px 0}
  #pa th,#pa td{border:1px solid #999;padding:3px 5px;color:#000;background:#fff}
  .zg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  figure{margin:0;break-inside:avoid;font-size:11px}
}
</style></head><body>
<header><b>欠点ビューア[矩形版]</b><small>v1.2 ・ 第一製造加工部 ・ 2026.11 matsubara</small>
<label class="b" id="ol">データを開く(JSON)<input id="fi" type="file" accept=".json,application/json" hidden></label>
<span>印刷:</span><select id="pm"><option value="one">単独(選択中の板)</option><option value="all">全部(全ての板)</option><option value="list">一覧リスト(表のみ)</option></select>
<label><input type="checkbox" id="pz"> 拡大図も印刷</label><select id="po"><option value="portrait">縦</option><option value="landscape">横</option></select><button class="pri" id="pb">印刷 / PDF保存</button><button id="cb">CSV出力</button><button id="rb">不具合発生通知書</button><button id="eb">配布用ファイルを出力</button>
<span id="info"></span></header>
<div id="empty">エクスポートしたJSONファイルを、「データを開く」またはこの画面へのドラッグ&ドロップで読み込んでください。</div>
<main id="mn" hidden>
<div class="col"><h3>ガラスのリスト</h3><div id="gl"></div></div>
<div class="col"><h3>板の全体</h3><canvas id="cv" width="800" height="500"></canvas><div id="lg"></div><h3>欠点リスト(クリックで拡大。↑↓キーでも選択)</h3><table><thead><tr><th>No.</th><th>面</th><th>種類</th><th>位置</th><th>状態・サイズ</th></tr></thead><tbody id="dl"></tbody></table></div>
<div class="col"><h3>拡大図</h3><canvas id="cz" width="800" height="500"></canvas><div id="dt"></div></div>
</main>
<div id="rd" hidden><div class="rc"><h3>不具合発生通知書の出力</h3><p id="rn"></p><div class="rg" id="rgd"></div><div class="rr"><button class="pri" id="rgo">出力</button><button id="rx">閉じる</button></div></div></div>
<div id="pa"></div>
<script id="emb" type="application/json"></script>
<script>
const CP={赤:"#dc2626",青:"#2563eb",黄:"#facc15",黒:"#111111",紫:"#9333ea",緑:"#16a34a",橙:"#f97316",水色:"#06b6d4",茶:"#92400e",ピンク:"#ec4899"},CT=Object.assign({},CP,{黄:"#a16207",橙:"#c2410c",水色:"#0e7490",ピンク:"#be185d"});
const TDEF={キズ:"赤",膜ハゲ:"青",汚れ:"黄",ガラス粉:"緑",異物:"紫",アワ:"水色","ハマ・カケ":"黒",ソゲ:"橙",その他:"茶"};
const T=TDEF,DR=["指定なし","横方向","縦方向","斜め"],DM=["指定なし","長さ","大きさ","幅","深さ"],MG={"ハマ":"ハマ・カケ","ハゲ":"膜ハゲ"};
let F=["非搬送面","搬送面"],EMB=false,COL=Object.assign({},TDEF);const cn=t=>COL[t]||T[t]||"黒",colOf=t=>CP[cn(t)],txtOf=t=>CT[cn(t)];
const tn=d=>d.t=="その他"?(d.tx!=null?d.tx:"その他"):d.t,tname=t=>t,stx=d=>[d.dr?DR[d.dr]:"",d.dm?DM[d.dm]:"",d.s||""].filter(Boolean).join(" ");
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null,cur=0,sel=-1;
const pos=d=>(d.xr?"右":"左")+"から"+d.x+"mm / "+(d.yr?"下":"上")+"から"+d.y+"mm"+(d.ln?" → 終点 "+(d.xr2?"右":"左")+"から"+d.x2+"mm / "+(d.yr2?"下":"上")+"から"+d.y2+"mm(長さ約"+d.len+"mm)":"");
const posS=d=>(d.xr?"右":"左")+d.x+"/"+(d.yr?"下":"上")+d.y+(d.ln?" → "+(d.xr2?"右":"左")+d.x2+"/"+(d.yr2?"下":"上")+d.y2+" 長さ約"+d.len+"mm":"");
const leg=A=>[...new Set(A.flatMap(s=>s.d.map(d=>d.t)))].map(t=>'<span style="margin-right:14px;white-space:nowrap"><span class="sw" style="background:'+colOf(t)+'"></span>'+cn(t)+"="+tname(t)+"</span>").join("");
const lbl=(d,j,nl)=>(j+1)+". "+F[d.f]+(tn(d)?" "+tn(d):"")+(d.ln&&!nl?" 長さ約"+d.len+"mm":"")+(stx(d)?" "+stx(d):"");
const sumTxt=(d,i)=>lbl(d,i)+"  "+pos(d);
function geo(s,bx,by,bw,bh,v){
  if(v){const k=Math.min(bw/(v.x1-v.x0),bh/(v.y1-v.y0));return{k,ox:bx-v.x0*k,oy:by-v.y0*k,gw:s.w*k,gh:s.h*k}}
  const k=Math.min((bw-96)/s.w,(bh-100)/s.h),gw=s.w*k,gh=s.h*k;return{k,gw,gh,ox:bx+(bw-gw)/2,oy:by+52+(bh-96-gh)/2}}
function zview(s,d){
  const pts=[[d.xr,d.x,d.yr,d.y]];if(d.ln)pts.push([d.xr2,d.x2,d.yr2,d.y2]);
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  pts.forEach(a=>{const ax=a[0]?s.w-a[1]:a[1],ay=a[2]?s.h-a[3]:a[3],ex=a[0]?s.w:0,ey=a[2]?s.h:0;x0=Math.min(x0,ax,ex);x1=Math.max(x1,ax,ex);y0=Math.min(y0,ay,ey);y1=Math.max(y1,ay,ey)});
  const mx=Math.max((x1-x0)*.35,60),my=Math.max((y1-y0)*.35,60);x0-=mx;x1+=mx;y0-=my;y1+=my;
  const w=x1-x0,h=y1-y0,a=1.6;
  if(w/h<a){const nw=h*a;x0-=(nw-w)/2;x1=x0+nw}else{const nh=w/a;y0-=(nh-h)/2;y1=y0+nh}
  return{x0,y0,x1,y1}}
function arrow(c,x,y,d,m){const L=((d=="←"||d=="→")?26:18)*m,h=7*m,u={"←":[-1,0],"→":[1,0],"↑":[0,-1],"↓":[0,1]}[d],ux=u[0],uy=u[1],x1=x+ux*L,y1=y+uy*L;
  c.strokeStyle="#111";c.fillStyle="#111";c.lineWidth=2.5;ln(c,x-ux*L,y-uy*L,x1,y1);
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-ux*h-uy*h*.8,y1-uy*h+ux*h*.8);c.lineTo(x1-ux*h+uy*h*.8,y1-uy*h-ux*h*.8);c.closePath();c.fill();c.lineWidth=1;
  lab(c,"搬送方向",x-(uy?10*m:L+6*m),y+4*m,12*m,"#111","right")}
function lab(c,t,x,y,sz,col,al){c.font=sz+"px sans-serif";c.fillStyle=col;c.textAlign=al||"center";c.fillText(t,x,y)}
function ln(c,a,b,x,y){c.beginPath();c.moveTo(a,b);c.lineTo(x,y);c.stroke()}
function draw(c,s,i,bx,by,bw,bh,o){
  o=o||{};const v=o.view,m=o.f||1,{k,gw,gh,ox,oy}=geo(s,bx,by,bw,bh,v),fs=(v?14:11)*m;
  c.save();c.beginPath();c.rect(bx,by,bw,bh);c.clip();
  c.fillStyle="#fff";c.fillRect(bx,by,bw,bh);
  if(v)lab(c,"拡大",bx+10,by+20*m,13*m,"#64748b","left");else lab(c,"No."+(i+1)+"   "+s.w+" × "+s.h,bx+12,by+24*m,16*m,"#111","left");
  if(!v&&D&&D.dir&&D.dir!="パレット積載図")arrow(c,bx+bw-50*m,by+28*m,D.dir,m);
  c.beginPath();
  if(s.sh=="circle")c.ellipse(ox+gw/2,oy+gh/2,gw/2,gh/2,0,0,7);else c.rect(ox,oy,gw,gh);
  c.fillStyle="#f1f5f9";c.fill();c.lineWidth=2;c.strokeStyle="#111";c.stroke();
  if(!v&&D&&D.dir=="パレット積載図"){lab(c,"パレット積載図",bx+bw-12*m,by+24*m,14*m,"#92400e","right");c.fillStyle="#b45309";c.fillRect(ox-8*m,oy+gh,gw+16*m,10*m);c.fillStyle="#78350f";c.fillRect(ox-8*m,oy+gh+10*m,gw+16*m,3*m)}
  if(s.none&&!v)lab(c,"欠点なし",ox+gw/2,oy+gh/2+8,24*m,"#94a3b8");
  c.lineWidth=1;
  s.d.forEach((d,j)=>{
    if(o.only!=null&&o.only!==j)return;
    const col=colOf(d.t),r=(v?9:7)*m,P=[[d.xr,d.x,d.yr,d.y]];if(d.ln)P.push([d.xr2,d.x2,d.yr2,d.y2]);
    const Q=P.map(a=>{const ax=a[0]?s.w-a[1]:a[1],ay=a[2]?s.h-a[3]:a[3];return{px:ox+ax*k,py:oy+ay*k,ex:a[0]?ox+gw:ox,ey:a[2]?oy+gh:oy,dx:a[1],dy:a[3]}});
    if(!o.compact||v||o.hi===j||o.lines){[Q[0]].forEach(q=>{c.strokeStyle="#64748b";c.lineWidth=1;c.setLineDash([4,3]);ln(c,q.px,q.py,q.ex,q.py);ln(c,q.px,q.py,q.px,q.ey);c.setLineDash([]);
      lab(c,q.dx,(q.px+q.ex)/2,q.py-4,fs,"#475569");c.save();c.translate(q.px-4,(q.py+q.ey)/2);c.rotate(-Math.PI/2);lab(c,q.dy,0,0,fs,"#475569");c.restore()})}
    if(d.ln){c.lineCap="round";c.strokeStyle="rgba(0,0,0,.6)";c.lineWidth=(v?6:5)*m;ln(c,Q[0].px,Q[0].py,Q[1].px,Q[1].py);c.strokeStyle=col;c.lineWidth=(v?4:3)*m;ln(c,Q[0].px,Q[0].py,Q[1].px,Q[1].py);c.lineCap="butt";c.lineWidth=1}
    if(d.ln&&d.len>0&&(!o.compact||v||o.hi===j||o.lines)){const a0=Math.atan2(Q[1].py-Q[0].py,Q[1].px-Q[0].px);let nx=-Math.sin(a0),ny=Math.cos(a0);const sy=d.yr?-1:1;if(ny*sy<0||(Math.abs(ny)<1e-6&&nx<0)){nx=-nx;ny=-ny}
      const ta=(a0>Math.PI/2||a0<=-Math.PI/2)?a0+Math.PI:a0,off=(v?15:12)*m;
      c.save();c.translate((Q[0].px+Q[1].px)/2+nx*off,(Q[0].py+Q[1].py)/2+ny*off);c.rotate(ta);c.font="bold "+((v?14:12)*m)+"px sans-serif";c.textAlign="center";c.textBaseline="middle";c.lineWidth=3;c.strokeStyle="#fff";c.strokeText(d.len+"mm",0,0);c.fillStyle="#111";c.fillText(d.len+"mm",0,0);c.restore()}
    Q.forEach((q,i)=>{const rr=i?r*.7:r;c.fillStyle=col;if(d.f){c.fillRect(q.px-rr,q.py-rr,2*rr,2*rr)}else{c.beginPath();c.arc(q.px,q.py,rr,0,7);c.fill()}
      c.strokeStyle="rgba(0,0,0,.6)";c.lineWidth=1;if(d.f)c.strokeRect(q.px-rr,q.py-rr,2*rr,2*rr);else{c.beginPath();c.arc(q.px,q.py,rr,0,7);c.stroke()}});
    const px=Q[0].px,py=Q[0].py;
    if(o.hi===j&&!v){c.lineWidth=2.5;c.strokeStyle="#dc2626";c.beginPath();c.arc(px,py,r+4,0,7);c.stroke();c.beginPath();c.arc(px,py,r+9,0,7);c.stroke();c.lineWidth=1}
    const right=px-bx<bw*.65;
    lab(c,o.compact&&!v&&o.hi!==j?String(j+1):lbl(d,j,1),px+(right?r+4:-r-4),py-r-2,(v?15:13)*m,txtOf(d.t),right?"left":"right");
  });
  c.restore();
}
function load(j){
  if(!j||!Array.isArray(j.sheets)||!j.sheets.length)throw 0;
  j.sheets.forEach(s=>{if(s.sh!="circle")s.sh="rect";s.d=(s.d||[]).map(d=>{d=Object.assign({f:0,s:"",dr:0,dm:0,ln:0,xr:0,yr:0,x:0,y:0},d);if(d.ln){d.xr2=d.xr2||0;d.yr2=d.yr2||0;d.x2=d.x2||0;d.y2=d.y2||0;const a=[d.xr?s.w-d.x:d.x,d.yr?s.h-d.y:d.y],b=[d.xr2?s.w-d.x2:d.x2,d.yr2?s.h-d.y2:d.y2];d.len=Math.round(Math.hypot(a[0]-b[0],a[1]-b[1]))}d.t=MG[d.t]||d.t;if(!T[d.t])d.t="その他";return d})});
  if(Array.isArray(j.face)&&j.face.length==2)F=j.face;
  COL=Object.assign({},TDEF);if(j.col&&typeof j.col=="object")Object.keys(j.col).forEach(t=>{if(T[t]&&CP[j.col[t]])COL[t]=j.col[t]});
  D=j;cur=0;sel=-1;if(!EMB)try{localStorage.setItem("ktv",JSON.stringify(j))}catch(e){}show()}
function show(){
  $("empty").hidden=!!D;$("mn").hidden=!D;if(!D)return;
  const s=D.sheets[cur];
  $("info").textContent=(D.memo||"")+"  "+(D.date||"");
  $("gl").innerHTML=D.sheets.map((t,i)=>'<button data-i="'+i+'"'+(i==cur?' class="on"':'')+'>No.'+(i+1)+'<small>'+t.w+'×'+t.h+'  '+(t.d.length?'欠点'+t.d.length+'件':'欠点なし')+'</small></button>').join("");
  $("dl").innerHTML=s.d.map((d,j)=>'<tr data-j="'+j+'"'+(j==sel?' class="on"':'')+'><td>'+(j+1)+'</td><td>'+F[d.f]+'</td><td>'+esc(tn(d))+" ("+cn(d.t)+")"+'</td><td>'+pos(d)+'</td><td>'+esc(stx(d))+'</td></tr>').join("")||'<tr><td colspan="4">欠点なし</td></tr>';
  draw($("cv").getContext("2d"),s,cur,0,0,800,500,{hi:sel,compact:true});
  const z=$("cz").getContext("2d"),d=s.d[sel];
  if(d){draw(z,s,cur,0,0,800,500,{only:sel,view:zview(s,d)});
    $("dt").innerHTML="<b>"+esc(sumTxt(d,sel))+"</b><br>面: "+F[d.f]+" / 種類: "+esc(tn(d))+" ("+cn(d.t)+")"+"<br>位置: "+pos(d)+"<br>状態・サイズ: "+(esc(stx(d))||"-")}
  else{z.fillStyle="#fff";z.fillRect(0,0,800,500);lab(z,"欠点リストから選択してください",400,250,22,"#94a3b8");$("dt").textContent=""}
  $("lg").innerHTML=leg([s])
}
$("gl").onclick=e=>{const b=e.target.closest("button");if(b){cur=+b.dataset.i;sel=-1;show()}};
$("dl").onclick=e=>{const r=e.target.closest("tr");if(r&&r.dataset.j!=null){sel=+r.dataset.j;show()}};
document.addEventListener("keydown",e=>{
  if(!D||(e.key!="ArrowDown"&&e.key!="ArrowUp"))return;e.preventDefault();
  const n=D.sheets[cur].d.length;if(!n)return;sel=e.key=="ArrowDown"?Math.min(n-1,sel+1):Math.max(0,sel<0?0:sel-1);show()});
function rd(f){const r=new FileReader();r.onload=()=>{try{load(JSON.parse(r.result))}catch(e){alert("読み込めないファイルです。入力アプリのエクスポートで作成したJSONを選んでください。")}};r.readAsText(f)}
$("fi").onchange=e=>{if(e.target.files[0])rd(e.target.files[0]);e.target.value=""};
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();if(e.dataTransfer.files[0])rd(e.dataTransfer.files[0])});
function img(s,i,o,w,h){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),s,i,0,0,w,h,o);return'<img src="'+c.toDataURL("image/png")+'" alt="">'}
const head=()=>'<div style="font-size:11px;color:#444">欠点報告  '+esc(D.memo||"")+'  '+esc(D.date||"")+'</div>';
function page(s,i,zm){
  return'<section class="pg">'+head()+leg([s])+'<h2>No.'+(i+1)+'  '+s.w+'×'+s.h+(s.d.length?'':'  欠点なし')+'</h2>'+img(s,i,{compact:true,f:1.3},1000,620)+
  (s.d.length?'<table><tr><th>No.</th><th>面</th><th>種類</th><th>位置</th><th>状態・サイズ</th></tr>'+s.d.map((d,j)=>'<tr><td>'+(j+1)+'</td><td>'+F[d.f]+'</td><td>'+esc(tn(d))+" ("+cn(d.t)+")"+'</td><td>'+pos(d)+'</td><td>'+esc(stx(d))+'</td></tr>').join("")+'</table>':'')+
  (zm&&s.d.length?'<div class="zg">'+s.d.map((d,j)=>'<figure>'+img(s,i,{only:j,view:zview(s,d),f:1.1},640,400)+'<figcaption>'+esc(sumTxt(d,j))+'</figcaption></figure>').join("")+'</div>':'')+'</section>'}
$("pb").onclick=()=>{
  if(!D){alert("先にデータを開いてください");return}
  const m=$("pm").value,zm=$("pz").checked;let h;
  if(m=="one")h=page(D.sheets[cur],cur,zm);
