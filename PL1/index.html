<script>
const T={キズ:"#0891b2",膜ハゲ:"#dc2626",汚れ:"#6b7280",ガラス粉:"#ca8a04",異物:"#9333ea",アワ:"#2563eb","ハマ・カケ":"#16a34a",ソゲ:"#c2410c",その他:"#374151"},DR=["指定なし","横方向","縦方向","斜め"],DM=["指定なし","長さ","大きさ","幅","深さ"],MG={"ハマ":"ハマ・カケ","ハゲ":"膜ハゲ"};

function geo(s,bx,by,bw,bh,v){

  const k=Math.min((bw-96)/s.w,(bh-100)/s.h),gw=s.w*k,gh=s.h*k;return{k,gw,gh,ox:bx+(bw-gw)/2,oy:by+52+(bh-96-gh)/2}}
function zview(s,d){
  const ax=d.xr?s.w-d.x:d.x,ay=d.yr?s.h-d.y:d.y,ex=d.xr?s.w:0,ey=d.yr?s.h:0;
  let x0=Math.min(ax,ex),x1=Math.max(ax,ex),y0=Math.min(ay,ey),y1=Math.max(ay,ey);
  const mx=Math.max((x1-x0)*.35,60),my=Math.max((y1-y0)*.35,60);x0-=mx;x1+=mx;y0-=my;y1+=my;
  const w=x1-x0,h=y1-y0,a=1.6;

function arrow(c,x,y,d,m){const L=((d=="←"||d=="→")?26:18)*m,h=7*m,u={"←":[-1,0],"→":[1,0],"↑":[0,-1],"↓":[0,1]}[d],ux=u[0],uy=u[1],x1=x+ux*L,y1=y+uy*L;

  c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-ux*h-uy*h*.8,y1-uy*h+ux*h*.8);c.lineTo(x1-ux*h+uy*h*.8,y1-uy*h-ux*h*.8);c.closePath();c.fill();c.lineWidth=1;

function lab(c,t,x,y,sz,col,al){c.font=sz+"px sans-serif";c.fillStyle=col;c.textAlign=al||"center";c.fillText(t,x,y)}
function ln(c,a,b,x,y){c.beginPath();c.moveTo(a,b);c.lineTo(x,y);c.stroke()}
function draw(c,s,i,bx,by,bw,bh,o){
  o=o||{};const v=o.view,m=o.f||1,{k,gw,gh,ox,oy}=geo(s,bx,by,bw,bh,v),fs=(v?14:11)*m;

  if(s.none&&!v)lab(c,"欠点なし",ox+gw/2,oy+gh/2+8,24*m,"#94a3b8");

    if(o.only!=null&&o.only!==j)return;
    const ax=d.xr?s.w-d.x:d.x,ay=d.yr?s.h-d.y:d.y,px=ox+ax*k,py=oy+ay*k,ex=d.xr?ox+gw:ox,ey=d.yr?oy+gh:oy,col=T[d.t]||"#111",r=(v?9:7)*m;

}
function load(j){

  (zm&&s.d.length?'<div class="zg">'+s.d.map((d,j)=>'<figure>'+img(s,i,{only:j,view:zview(s,d),f:1.1},640,400)+'<figcaption>'+esc(sumTxt(d,j))+'</figcaption></figure>').join("")+'</div>':'')+'</section>'}
$("pb").onclick=()=>{
  if(!D){alert("先にデータを開いてください");return}

    D.sheets.map((s,i)=>s.d.length?s.d.map(d=>'<tr><td>No.'+(i+1)+'</td><td>'+s.w+'×'+s.h+'</td><td>'+F[d.f]+'</td><td>'+esc(tn(d))+'</td><td>'+d.n+'</td><td>'+pos(d)+'</td><td>'+esc(stx(d))+'</td></tr>').join(""):'<tr><td>No.'+(i+1)+'</td><td>'+s.w+'×'+s.h+'</td><td colspan="5">欠点なし</td></tr>').join("")+'</table></section>';
  $("pa").innerHTML=h;let st=document.getElementById("pst");if(!st){st=document.createElement("style");st.id="pst";document.head.appendChild(st)}
  st.textContent="@page{size:A4 "+$("po").value+";margin:10mm}";
  const t0=document.title;document.title="欠点報告_"+ymd();window.onafterprint=()=>{document.title=t0};
  setTimeout(()=>window.print(),150)};
const ymd=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0"),m=((D&&D.memo)||"").replace(/[\\\/:*?"<>|\s]+/g,"_").replace(/^_+|_+$/g,"").slice(0,20);return(m?m+"_":"")+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())};
function dl(txt,nm,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=nm;a.click()}
$("cb").onclick=()=>{
  if(!D){alert("先にデータを開いてください");return}
  const r=[["符号","形状","寸法W","寸法H","面","欠点種別","個数","X基準","X距離","Y基準","Y距離","方向","寸法種別","状態・サイズ"]];
  D.sheets.forEach((s,i)=>{const b=["No."+(i+1),s.sh=="circle"?"丸形":"矩形",s.w,s.h];
    if(!s.d.length)r.push(b.concat(["","なし","","","","","","","",""]));
    s.d.forEach(d=>r.push(b.concat([F[d.f],d.t,d.n,d.xr?"右":"左",d.x,d.yr?"下":"上",d.y,d.dr?DR[d.dr]:"",d.dm?DM[d.dm]:"",d.s])))});
  dl("\ufeff"+r.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"欠点一覧_"+ymd()+".csv","text/csv")};
